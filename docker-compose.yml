services:
  idvet:
    image: ${DOCKER_REGISTRY-}idvet
    build:
      context: .
      dockerfile: BlazorDockerApp/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "${HTTP_PORT}:8080"
    restart: unless-stopped